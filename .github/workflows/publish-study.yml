name: Complete verified audio study publication
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Restore reviewed project files and check hashes
        shell: bash
        run: |
          python3 - <<'PY_AUDIO'
          import base64, hashlib, io, json, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          hash_bytes = lambda data: hashlib.sha256(data).hexdigest()
          manifest = {'.gitignore': '40ee04b1c95948898c557f8d75562ff1f78ecd51aa003e302fb82b162e9280f4', 'README.md': 'b6cdaf33bee4d2a3a42a063895f8807aa3b688f010608926864d3920d12587b6', 'LICENSE.md': '9cfa5663fd50e5797ab0803a263a94da8f6653fdfcc345f7fab2653fede577ba', 'SOURCE-REVIEW.md': 'c6f68220d923c48924f562ed8acc7fa6a5834007d8a632f9d1b2a8dbd67d70bb', 'requirements.txt': '55d5982a9aad40581b032143e78d660e5640847da315404eb4e88c9d1e6a6013', 'study.py': 'ab439957702af8154d0e1d5672e7eec4b4d29be68f281177d81acfd357b5b2db', 'compare.py': '2f7afc4c082f11e94a9b89ff8dc4249db589f7b0a856e5619593454ee7fa01f3', 'normalized.py': '740c2a6ca8117fdc71f002f675705eec875d904c486c2c80fc1a939373281d43', 'checks.py': 'e245956f5b0caca7cb4a3ab89ede28f7edc3b92ed0186114d470b0af770da69a', 'walkthrough.ipynb': 'f1408f9b90a1311507e08118b2fbfea8f9be9d34614e69b2d5c3c1dbd85db277', 'docs/index.html': '42c009cb206d24021d780f0b42d25f22d88612a3130fb7a0b649643d706918ea', 'assets/project-overview.png': '5931230adc2cf8593b6c199ba3f5012fc4cd099e8e932ac7ce9047905edcefa9', 'results/metrics.json': 'e8da82bd1a6634b65a2448f46a25d4d3096f6140ffcbbb05b540a885f0e2262c', 'results/comparison.json': '99267702dc94dcc5482d5839ae3a3beaa626d450b7ceeb5cc72ac1f890cbaf28', 'results/normalized.json': '8f11fe13591b646e7a9bcd6e64a6cadbc6ade4c5abdb5b3d1287e4e40af51d15', 'results/predictions.npz': '42d70718ade98f93ace0b2de49568d26e42335dfcc3dba830b8428cb39ba1435', 'results/sequence-predictions.npz': '8c50d659f302dfacdfe9d74f87f93dcb6cef2a5f8768c8c2f85d2e4d2227c575', 'results/normalized-predictions.npz': 'dfb42c683362ede2ed8ac34ab2d4f5a5dad90075618f2b2e1a8bfa952d7881f1', 'results/audio-example.png': '70761ab17dc8ca2a1f24e94f4d1b9fbb2dac717ae8098f6368cc79ff82384ad0', 'results/evaluation.png': '6565dee5d1567236a99e08e98201e00ed687546585767fda5c2d52a745415728', 'results/confusion.png': 'e225070e7da81e7ecd6861f5dd24dc309a4c344fe121f76ae90585958f5e1592', 'results/comparison.png': '9c7b7c454d9acb6a5f5091ba27b55d3eb127ae437e366e7c8cdf94a7c25b7cd0', 'results/final-comparison.png': '5a0c21e63f7ca414169723d8fb075e10ba08fbf83495c61ee62e366fd232ffad', 'results/normalized-confusion.png': '8ca4d7c1d931e1a9b0ccc9e566130859e258c9a2bb945275f975034ceb681044'}
          existing = {'LICENSE.md': '9cfa5663fd50e5797ab0803a263a94da8f6653fdfcc345f7fab2653fede577ba', 'README.md': 'b6cdaf33bee4d2a3a42a063895f8807aa3b688f010608926864d3920d12587b6', 'SOURCE-REVIEW.md': 'c6f68220d923c48924f562ed8acc7fa6a5834007d8a632f9d1b2a8dbd67d70bb', 'UPSTREAM_README.md': '27dad915cd21a9b1445e45d9d251180037b1454c7e5605567a871c35e698b985', 'checks.py': 'e245956f5b0caca7cb4a3ab89ede28f7edc3b92ed0186114d470b0af770da69a', 'compare.py': '2f7afc4c082f11e94a9b89ff8dc4249db589f7b0a856e5619593454ee7fa01f3', 'manifest.json': '86ad26fe086636f19fb9dd98dfa81eec6e40aa9e94c2bbd6b125d3b3e5676b01', 'normalized.py': '740c2a6ca8117fdc71f002f675705eec875d904c486c2c80fc1a939373281d43', 'project-overview.png': '5931230adc2cf8593b6c199ba3f5012fc4cd099e8e932ac7ce9047905edcefa9', 'requirements.txt': '55d5982a9aad40581b032143e78d660e5640847da315404eb4e88c9d1e6a6013', 'study.py': 'ab439957702af8154d0e1d5672e7eec4b4d29be68f281177d81acfd357b5b2db', 'walkthrough.ipynb': 'f1408f9b90a1311507e08118b2fbfea8f9be9d34614e69b2d5c3c1dbd85db277'}
          # Abort if any already-uploaded file has changed since the publication review.
          for name, expected in existing.items():
              assert hash_bytes((root / name).read_bytes()) == expected, name
          payload = base64.b64decode((root / 'publication-payload.b64').read_text())
          assert hash_bytes(payload) == 'aaba33cbacfb94b4120cc61a11dff890244244eac7b833022f7571c46f28a2f7'
          missing = ['.gitignore', 'docs/index.html', 'results/metrics.json', 'results/comparison.json', 'results/normalized.json', 'results/predictions.npz', 'results/sequence-predictions.npz', 'results/normalized-predictions.npz', 'results/audio-example.png', 'results/evaluation.png', 'results/confusion.png', 'results/comparison.png', 'results/final-comparison.png', 'results/normalized-confusion.png']
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              assert sorted(archive.namelist()) == sorted(missing)
              for name in missing:
                  assert name in manifest and '..' not in pathlib.PurePosixPath(name).parts
                  content = archive.read(name)
                  assert hash_bytes(content) == manifest[name], name
                  destination = root / name
                  assert not destination.exists(), name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(content)
          (root / 'assets').mkdir(exist_ok=True)
          (root / 'project-overview.png').rename(root / 'assets/project-overview.png')
          # Dataset metadata is created in data/ by study.py --download; redundant root copies are removed.
          for name in ['UPSTREAM_README.md', 'manifest.json']:
              (root / name).unlink()
          for name, expected in manifest.items():
              assert hash_bytes((root / name).read_bytes()) == expected, name
          print('Verified all', len(manifest), 'public project files.')
          PY_AUDIO
      - name: Commit completed publication and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-study.yml publication-payload.b64
          git add -A
          git commit -m 'Publish verified audio results and visual report'
          git push origin HEAD:main
