      - name: Commit completed publication and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-study.yml
          git add -A
          git commit -m 'Publish verified audio results and visual report'
          git push origin HEAD:main
